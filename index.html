<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457a6">
<title>핵심 영단어 - 명사편</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f5f7fb;color:#18212f}
.app{max-width:520px;margin:auto;min-height:100dvh;padding:18px 16px 32px}
header{padding:8px 2px 18px}.eyebrow{font-size:13px;color:#2457a6;font-weight:800;letter-spacing:.08em}.title{font-size:28px;font-weight:900;margin:5px 0}.sub{color:#687386;font-size:14px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 7px 28px rgba(25,40,70,.08);margin-bottom:14px}
button,select{font:inherit}.btn{width:100%;border:0;border-radius:14px;padding:15px 14px;font-weight:800;cursor:pointer}.primary{background:#2457a6;color:white}.secondary{background:#edf2fa;color:#2457a6}.ghost{background:transparent;color:#5e6b7e;border:1px solid #dbe2ec}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.stat{font-size:12px;color:#6c788a}.bigstat{font-size:24px;font-weight:900;margin-top:3px}
.progress{height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;background:#2457a6;width:0%;transition:.25s}
.quiz-top{display:flex;justify-content:space-between;align-items:center;color:#6c788a;font-size:13px}.num{font-weight:800;color:#2457a6}
.question{min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.word{font-size:38px;font-weight:900;letter-spacing:-.02em}.meaning{font-size:25px;font-weight:900;line-height:1.35}
.options{display:grid;gap:10px}.option{background:#fff;border:2px solid #e1e7f0;border-radius:15px;padding:15px;text-align:left;font-size:16px;font-weight:700;cursor:pointer}.option:active{transform:scale(.99)}.option.correct{border-color:#2c9b68;background:#edf9f3}.option.wrong{border-color:#dc5b5b;background:#fff0f0}.feedback{font-size:14px;margin-top:10px;color:#566276;text-align:center;min-height:20px}
.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid #dbe2ec;background:white;border-radius:99px;padding:9px 12px;color:#5b687a;font-weight:700}.chip.active{background:#2457a6;color:#fff;border-color:#2457a6}
.hidden{display:none!important}.list{max-height:60vh;overflow:auto}.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #edf0f4}.item:last-child{border:0}.no{width:34px;color:#9aa5b5;font-size:12px;padding-top:3px}.item b{font-size:17px}.item span{display:block;color:#687386;margin-top:3px;font-size:14px}.wrongmark{margin-left:auto;color:#d65353;font-size:12px;font-weight:800}
label{font-size:13px;font-weight:800;color:#596679;display:block;margin-bottom:7px}.select{width:100%;padding:13px;border:1px solid #dbe2ec;border-radius:12px;background:white}
.result{text-align:center}.score{font-size:52px;font-weight:950;color:#2457a6}.muted{color:#748094}
@media(min-width:700px){body{padding:24px}.app{min-height:auto}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="eyebrow">KESSAM · 핵심 영단어</div>
<div class="title">명사편 단어 퀴즈</div>
<div class="sub">PDF의 224개 단어를 휴대폰에서 바로 학습</div>
</header>

<section id="home">
<div class="card">
<div class="grid">
<div><div class="stat">전체 단어</div><div class="bigstat">224</div></div>
<div><div class="stat">누적 정답률</div><div class="bigstat" id="homeRate">0%</div></div>
</div>
</div>
<div class="card">
<label>출제 방향</label>
<select id="direction" class="select">
<option value="enko">영어 → 뜻</option>
<option value="koen">뜻 → 영어</option>
</select>
<br><br>
<label>문제 수</label>
<select id="count" class="select">
<option value="10">10문제</option><option value="20">20문제</option><option value="30">30문제</option>
<option value="50">50문제</option><option value="all">전체 224문제</option>
</select>
<br><br>
<div class="grid">
<button class="btn primary" onclick="startQuiz(false)">퀴즈 시작</button>
<button class="btn secondary" onclick="startQuiz(true)">틀린 단어</button>
</div>
</div>
<div class="card">
<div class="toolbar">
<button class="chip active" id="tabStudy" onclick="showTab('study')">단어장</button>
<button class="chip" id="tabWrong" onclick="showTab('wrong')">틀린 단어</button>
</div>
<div id="studyList" class="list"></div>
<div id="wrongList" class="list hidden"></div>
</div>
<div class="card">
<button class="btn ghost" onclick="resetStats()">학습 기록 초기화</button>
</div>
</section>

<section id="quiz" class="hidden">
<div class="card">
<div class="quiz-top"><span id="qCount">1 / 10</span><span class="num" id="qNo">No.1</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
<div class="feedback" id="feedback"></div>
</div>
<button class="btn ghost" id="quitBtn" onclick="goHome()">퀴즈 종료</button>
</section>

<section id="result" class="hidden">
<div class="card result">
<div class="stat">QUIZ RESULT</div>
<div class="score" id="score">0 / 0</div>
<div id="resultText" class="muted"></div>
<br>
<button class="btn primary" onclick="goHome()">홈으로</button>
</div>
<div class="card">
<button class="btn secondary" onclick="startQuiz(false)">다시 풀기</button>
</div>
</section>
</div>

let stats = JSON.parse(localStorage.getItem('vocabStats')||'{}');
let quiz=[], idx=0, correct=0, answered=false, wrongInQuiz=[];

function save(){localStorage.setItem('vocabStats',JSON.stringify(stats));}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function normalize(s){return s.replace(/\s+/g,'').toLowerCase()}
function rate(){
 const vals=Object.values(stats); if(!vals.length)return 0;
 const a=vals.reduce((x,v)=>x+v.c,0), b=vals.reduce((x,v)=>x+v.t,0);
 return b?Math.round(a/b*100):0;
}
function renderHome(){
 document.getElementById('homeRate').textContent=rate()+'%';
 const list=document.getElementById('studyList');
 list.innerHTML=WORDS.map(x=>`<div class="item"><div class="no">${x.no}</div><div><b>${x.word}</b><span>${x.meaning}</span></div>${stats[x.no]?.w?`<div class="wrongmark">${stats[x.no].w}회 오답</div>`:''}</div>`).join('');
 renderWrong();
}
function renderWrong(){
 const bad=WORDS.filter(x=>stats[x.no]?.w>0);
 document.getElementById('wrongList').innerHTML=bad.length?bad.map(x=>`<div class="item"><div class="no">${x.no}</div><div><b>${x.word}</b><span>${x.meaning}</span></div><div class="wrongmark">${stats[x.no].w}회</div></div>`).join(''):'<div style="padding:28px 5px;text-align:center;color:#7b8798">아직 틀린 단어가 없어!</div>';
}
function showTab(t){
 document.getElementById('studyList').classList.toggle('hidden',t!=='study');
 document.getElementById('wrongList').classList.toggle('hidden',t!=='wrong');
 document.getElementById('tabStudy').classList.toggle('active',t==='study');
 document.getElementById('tabWrong').classList.toggle('active',t==='wrong');
}
function startQuiz(wrongOnly){
 const direction=document.getElementById('direction').value;
 let pool=wrongOnly?WORDS.filter(x=>stats[x.no]?.w>0):WORDS;
 if(!pool.length){alert('틀린 단어가 아직 없어!');return}
 let n=document.getElementById('count').value;
 n=n==='all'?pool.length:Math.min(+n,pool.length);
 quiz=shuffle(pool).slice(0,n); idx=0; correct=0; wrongInQuiz=[]; answered=false;
 document.getElementById('home').classList.add('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 renderQuestion(direction);
 window.scrollTo(0,0);
}
function renderQuestion(direction){
 answered=false;
 const x=quiz[idx];
 document.getElementById('qCount').textContent=`${idx+1} / ${quiz.length}`;
 document.getElementById('qNo').textContent=`No.${x.no}`;
 document.getElementById('bar').style.width=(idx/quiz.length*100)+'%';
 let prompt=direction==='enko'?`<div class="word">${x.word}</div>`:`<div class="meaning">${x.meaning}</div>`;
 document.getElementById('question').innerHTML=prompt;
 let pool=shuffle(WORDS.filter(y=>y.no!==x.no)).slice(0,3);
 let opts=shuffle([x,...pool]);
 document.getElementById('options').innerHTML=opts.map((o,i)=>{
   let label=direction==='enko'?o.meaning:o.word;
   return `<button class="option" data-no="${o.no}" onclick="answer(${o.no},this)">${String.fromCharCode(65+i)}. ${label}</button>`
 }).join('');
 document.getElementById('feedback').textContent='';
}
function answer(no,el){
 if(answered)return;
 answered=true;
 const x=quiz[idx], ok=no===x.no;
 stats[x.no]??={c:0,t:0,w:0};
 stats[x.no].t++;
 if(ok){correct++;stats[x.no].c++;el.classList.add('correct');document.getElementById('feedback').textContent='정답!';}
 else{stats[x.no].w++;wrongInQuiz.push(x.no);el.classList.add('wrong');document.querySelector(`.option[data-no="${x.no}"]`).classList.add('correct');document.getElementById('feedback').textContent=`정답: ${x.word} — ${x.meaning}`;}
 save();
 setTimeout(()=>{
   idx++;
   if(idx<quiz.length) renderQuestion(document.getElementById('direction').value);
   else finish();
 },700);
}
function finish(){
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('score').textContent=`${correct} / ${quiz.length}`;
 const pct=Math.round(correct/quiz.length*100);
 document.getElementById('resultText').textContent=`정답률 ${pct}% · 오답 ${quiz.length-correct}개`;
 renderHome();
 window.scrollTo(0,0);
}
function goHome(){
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.add('hidden');
 document.getElementById('home').classList.remove('hidden');
 renderHome();window.scrollTo(0,0);
}
function resetStats(){
 if(confirm('모든 학습 기록을 삭제할까요?')){stats={};save();renderHome();}
}
